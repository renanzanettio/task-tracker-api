name: CI Pipeline

on:
  # Dispara automaticamente ao enviar novos commits para a branch main
  push:
    branches:
      - main
  # Dispara na abertura ou atualização de Pull Requests direcionados para a branch main
  pull_request:
    branches:
      - main
  # Permite execução manual pelo painel web do GitHub Actions
  workflow_dispatch:

# Permite cancelar execuções anteriores na mesma branch se novos commits forem enviados
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Qualidade e Checagem de Tipos (Fail-Fast)
  validacoes:
    name: 1. Qualidade e Checagem de Tipos
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código-fonte
        uses: actions/checkout@v4

      - name: 2. Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 3. Instalar dependências
        run: npm ci

      - name: 4. Validar Padronização de Código (ESLint)
        run: npm run lint

      - name: 5. Validar Formatação de Arquivos (Prettier)
        run: npm run format:check

      - name: 6. Checagem de Tipos (tsc --noEmit)
        run: npm run type-check

  # Job 2: Build de Produção e Imagem Docker (só executa se o Job 1 passar)
  build-e-docker:
    name: 2. Build e Imagem Docker
    needs: validacoes
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código-fonte
        uses: actions/checkout@v4

      - name: 2. Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 3. Instalar dependências
        run: npm ci

      - name: 4. Compilar o Backend (build de produção)
        run: npm run build

      - name: 5. Validar Construção da Imagem Docker da API
        run: docker build -t task-tracker-api:test .

      - name: 6. Resumo da execução
        run: |
          echo "### Resumo da Execução do Pipeline de CI" >> $GITHUB_STEP_SUMMARY
          echo "Integração Contínua concluída com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "- Autor: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
